<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library</title>
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>
  <script src="https://kit.fontawesome.com/a13740fce7.js" crossorigin="anonymous"></script>
</head>

<body>
  <div class="container">
    <nav class="navbar bg-1 fg-2">
      <div class="container-fluid">
        <div class="navbar-brand" href="#">
          <i class="fa-solid fa-book-open"></i>
          MyLibrary
        </div>
        <button id="add" type="button" class="theme-success btn-solid btn-styled btn-sm" data-bs-toggle="dialog"
          data-bs-target="#slideUpDialog">Add</button>
      </div>
    </nav>
    <div>
      <table class="table">
        <thead>
          <th>Title</th>
          <th>Author</th>
          <th>Length</th>
          <th>Read</th>
          <th></th>
        </thead>
        <tbody id="tableBody">

        </tbody>
      </table>
    </div>
  </div>
  <dialog class="dialog dialog-slide-up" id="slideUpDialog">
    <div class="dialog-header">
      <h1 class="dialog-title">Add a Book to MyLibrary</h1>
      <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
    </div>
    <div class="dialog-body">
      <form action="">
        <div class="mb-3">
          <label for="title" class="form-label">Title</label>
          <input type="text" class="form-control" id="title">
        </div>
        <div class="mb-3">
          <label for="author" class="form-label">Author</label>
          <input type="text" class="form-control" id="author">
        </div>
        <div class="mb-3">
          <label for="length" class="form-label">Number of Pages</label>
          <input type="number" class="form-control" id="length">
        </div>
        <div class="form-field mb-3">
          <input type="checkbox" id="read" class="check" />
          <label for="fieldCheck">I've read this book</label>
        </div>
      </form>
    </div>
    <div class="dialog-footer">
      <button type="button" class="btn-solid theme-secondary btn-sm" data-bs-dismiss="dialog">Close</button>
      <button type="button" class="btn-solid theme-primary btn-sm" data-bs-dismiss="dialog" id="submit">Submit</button>
    </div>
  </dialog>
</body>

</html>
